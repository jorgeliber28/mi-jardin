<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Catálogo de las 24 plantas de interior de la casa: riego, luz, sustrato, poda y problemas comunes, agrupadas por zona de luz.">
<meta name="theme-color" content="#E9E5D8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171611" media="(prefers-color-scheme: dark)">
<title>Mi Jardín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* ==========================================================================
   MI JARDÍN — catálogo de plantas de interior
   Tratamiento visual: pliego de herbario. Papel de montaje, lámina montada
   a la izquierda, etiqueta mecanografiada con los datos del espécimen.
   Paleta: papel/tinta/verde de herbario; el carmín es tinta de sello y solo
   aparece en advertencias reales (toxicidad, problemas).
   ========================================================================== */

:root{
    --papel:      #E9E5D8;   /* cartón de montaje */
    --ficha:      #F4F1E4;   /* pliego del espécimen */
    --tinta:      #211F19;
    --tinta-2:    #6E695B;
    --tinta-3:    #918B79;
    --verde:      #3F5233;   /* verde de herbario: el acento */
    --verde-2:    #6B7F55;
    --carmin:     #8E2B22;   /* tinta de sello: solo advertencias */
    --linea:      #CBC5B2;
    --linea-2:    #DDD8C7;
    --sombra:     0 1px 2px rgba(33,31,25,.05), 0 6px 18px -12px rgba(33,31,25,.22);

    --serif:  'EB Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    --sans:   'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mecano: 'Courier Prime', 'Courier New', Courier, monospace;

    --ancho: 660px;
}

@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --papel:   #171611;
        --ficha:   #201E18;
        --tinta:   #E9E4D5;
        --tinta-2: #9A937F;
        --tinta-3: #7C7663;
        --verde:   #9CB37E;
        --verde-2: #7F9464;
        --carmin:  #D2786C;
        --linea:   #383527;
        --linea-2: #2C2A20;
        --sombra:  0 1px 2px rgba(0,0,0,.35), 0 6px 18px -12px rgba(0,0,0,.7);
    }
}
:root[data-theme="dark"]{
    --papel:   #171611;
    --ficha:   #201E18;
    --tinta:   #E9E4D5;
    --tinta-2: #9A937F;
    --tinta-3: #7C7663;
    --verde:   #9CB37E;
    --verde-2: #7F9464;
    --carmin:  #D2786C;
    --linea:   #383527;
    --linea-2: #2C2A20;
    --sombra:  0 1px 2px rgba(0,0,0,.35), 0 6px 18px -12px rgba(0,0,0,.7);
}

*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
    margin: 0;
    background: var(--papel);
    color: var(--tinta);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}
a{ color: inherit; }
:focus-visible{
    outline: 2px solid var(--verde);
    outline-offset: 2px;
    border-radius: 2px;
}

/* ---------- Cabecera del pliego ---------------------------------------- */

.masthead{
    max-width: var(--ancho);
    margin: 0 auto;
    padding: 34px 20px 0;
}
.masthead h1{
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    letter-spacing: .22em;
    text-transform: uppercase;
    text-indent: .22em;
    text-align: center;
    margin: 0 0 10px;
    text-wrap: balance;
}
.masthead .sub{
    font-family: var(--mecano);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--tinta-2);
    text-align: center;
    margin: 0 0 16px;
}
/* filete doble: grueso + fino, como en las láminas impresas */
.filete{
    border-top: 2px solid var(--tinta);
    border-bottom: 1px solid var(--tinta);
    height: 4px;
    opacity: .8;
}

/* ---------- Navegación por zonas --------------------------------------- */

.nav-wrap{
    position: relative;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--papel);
    border-bottom: 1px solid var(--linea);
}
.nav{
    max-width: var(--ancho);
    margin: 0 auto;
    display: flex;
    gap: 22px;
    overflow-x: auto;
    padding: 12px 20px 0;
    scrollbar-width: none;
}
.nav::-webkit-scrollbar{ display: none; }
/* insinúa que la fila sigue hacia la derecha */
.nav-wrap::after{
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 1px;
    width: 34px;
    pointer-events: none;
    background: linear-gradient(to right, transparent, var(--papel));
}
@media (min-width: 720px){ .nav-wrap::after{ display: none; } }
.nav button{
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 0 0 9px;
    margin: 0;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--tinta-2);
    font-family: var(--mecano);
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    transition: color .18s ease, border-color .18s ease;
}
.nav button:hover{ color: var(--tinta); }
.nav button[aria-selected="true"]{
    color: var(--verde);
    border-bottom-color: var(--verde);
}

/* ---------- Buscador ---------------------------------------------------- */

.buscador{
    max-width: var(--ancho);
    margin: 0 auto;
    padding: 16px 20px 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-bottom: 1px solid var(--linea-2);
}
.buscador label{
    font-family: var(--mecano);
    font-size: .64rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--tinta-3);
    flex-shrink: 0;
}
.buscador input{
    flex: 1;
    min-width: 0;
    appearance: none;
    background: none;
    border: 0;
    padding: 0 0 12px;
    color: var(--tinta);
    font-family: var(--mecano);
    font-size: .88rem;
}
.buscador input::placeholder{ color: var(--tinta-3); }
.buscador input:focus{ outline: none; }
.buscador:focus-within{ border-bottom-color: var(--verde); }

/* ---------- Encabezado de sección --------------------------------------- */

.hoja{
    max-width: var(--ancho);
    margin: 0 auto;
    padding: 0 20px 56px;
}
.seccion{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 26px 0 14px;
}
.seccion h2{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.45rem;
    margin: 0;
    line-height: 1.15;
}
.seccion .desc{
    font-family: var(--mecano);
    font-size: .66rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--tinta-2);
    margin-top: 4px;
}
.seccion .conteo{
    font-family: var(--mecano);
    font-size: .66rem;
    letter-spacing: .1em;
    color: var(--tinta-3);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* ---------- Ficha de espécimen ------------------------------------------ */

.ficha{
    background: var(--ficha);
    border: 1px solid var(--linea);
    box-shadow: var(--sombra);
    margin-bottom: 14px;
}
.ficha-top{
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 16px;
    padding: 16px;
    align-items: start;
}

/* la lámina montada: enlace a fotos reales */
.marco{
    position: relative;
    display: block;
    width: 96px;
    height: 96px;
    padding: 5px;
    background: #F4F1E4;
    border: 1px solid var(--linea);
    text-decoration: none;
    transition: border-color .18s ease, transform .18s ease;
}
.marco:hover{ border-color: var(--verde); }
.marco:active{ transform: scale(.97); }
.marco .lienzo{
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
.plant-svg{ width: 100%; height: 100%; display: block; }
.plant-photo{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .45s ease;
}
.plant-photo.loaded{ opacity: 1; }
.sin-lamina{
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--tinta-3);
}
/* indicador de que la lámina lleva a fotos */
.marco .lupa{
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(244,241,228,.94);
    border: 1px solid var(--linea);
    color: #3F5233;
}
.marco .lupa svg{ width: 11px; height: 11px; }

/* el resumen es el botón que despliega la ficha */
.resumen{
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    cursor: pointer;
    display: block;
}
.linea-sup{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
}
.linea-sup > span:first-child{ min-width: 0; }
.acceso{
    font-family: var(--mecano);
    font-size: .6rem;
    letter-spacing: .1em;
    color: var(--tinta-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
.nombre{
    display: block;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.24rem;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
}
.binomio{
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1rem;
    color: var(--tinta-2);
    margin: 1px 0 0;
}
.sitio{
    display: block;
    font-family: var(--mecano);
    font-size: .64rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--tinta-3);
    margin: 7px 0 0;
}
.sello{
    display: inline-block;
    margin-left: 9px;
    padding: 1px 6px;
    vertical-align: baseline;
    border: 1px solid var(--carmin);
    color: var(--carmin);
    font-family: var(--mecano);
    font-weight: 700;
    font-size: .58rem;
    letter-spacing: .16em;
    transform: rotate(-1.5deg);
}

/* etiqueta mecanografiada con los tres datos de campo */
.etiqueta{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 12px;
    border-top: 1px solid var(--linea-2);
}
.etiqueta > span{
    padding: 9px 10px 0 0;
}
.etiqueta > span + span{
    border-left: 1px solid var(--linea-2);
    padding-left: 10px;
}
.etiqueta .dt{
    display: block;
    font-family: var(--mecano);
    font-size: .56rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--tinta-3);
    margin: 0 0 2px;
}
.etiqueta .dd{
    display: block;
    margin: 0;
    font-size: .84rem;
    font-weight: 500;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
}

.chevron{
    display: block;
    margin: 12px auto 0;
    width: 15px;
    height: 15px;
    color: var(--tinta-3);
    transition: transform .28s ease, color .18s ease;
}
.ficha.abierta .chevron{ transform: rotate(180deg); color: var(--verde); }
.resumen:hover .chevron{ color: var(--verde); }

/* ---------- Detalle desplegable ----------------------------------------- */

.detalle{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
}
.ficha.abierta .detalle{ grid-template-rows: 1fr; }
.detalle > .interior{ overflow: hidden; }

.campos{
    border-top: 1px solid var(--linea);
    padding: 4px 16px 16px;
}
.campo{
    display: grid;
    grid-template-columns: 18px 1fr;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid var(--linea-2);
}
.campo:last-child{ border-bottom: 0; }
.campo svg{
    width: 16px;
    height: 16px;
    margin-top: 2px;
    color: var(--verde);
}
.campo h3{
    font-family: var(--mecano);
    font-size: .6rem;
    font-weight: 400;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--tinta-2);
    margin: 0 0 3px;
}
.campo p{
    margin: 0;
    max-width: 64ch;
    font-size: .89rem;
    line-height: 1.5;
    color: var(--tinta);
}
.campo.aviso svg{ color: var(--carmin); }
.campo.aviso h3{ color: var(--carmin); }

/* en pantallas anchas, los datos cortos van en dos columnas */
@media (min-width: 620px){
    .campos{
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 26px;
    }
    .campo.ancho{ grid-column: 1 / -1; }
}

/* ---------- Pie ---------------------------------------------------------- */

.vacio{
    font-family: var(--mecano);
    font-size: .78rem;
    color: var(--tinta-2);
    padding: 34px 0;
    text-align: center;
}
.pie{
    max-width: var(--ancho);
    margin: 0 auto;
    padding: 0 20px 44px;
    border-top: 1px solid var(--linea);
    padding-top: 18px;
    font-family: var(--mecano);
    font-size: .64rem;
    line-height: 1.7;
    letter-spacing: .06em;
    color: var(--tinta-3);
}
.pie a{ color: var(--tinta-2); }

@media (max-width: 400px){
    .masthead{ padding-top: 26px; }
    .masthead .sub{ font-size: .6rem; letter-spacing: .1em; }
    .ficha-top{ grid-template-columns: 84px 1fr; gap: 13px; padding: 14px; }
    .marco{ width: 84px; height: 84px; }
    .nombre{ font-size: 1.15rem; }
    .binomio{ font-size: .95rem; }
    .etiqueta > span{ padding-right: 7px; }
    .etiqueta > span + span{ padding-left: 7px; }
    .etiqueta .dd{ font-size: .79rem; }
}

@media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

        function icono(nombre, extra){
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" '
                 + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'
                 + (extra ? ' class="' + extra + '"' : '') + '>' + ICONOS[nombre] + '</svg>';
        }


        /* ===== ÍNDICE DE LA COLECCIÓN =====
           Cada planta recibe un número de acceso continuo y estable: es el
           índice del ejemplar dentro de la colección, no su orden de lectura. */

        const ZONAS = Object.keys(plantas);
        const TODAS = [];
        ZONAS.forEach(clave => {
            plantas[clave].plantas.forEach(p => {
                p._zona = clave;
                p._n = TODAS.length + 1;
                const txt = (p.especial || '') + ' ' + (p.problemas || '');
                p._toxica = /t[óo]xic/i.test(txt) && !/no\s+t[óo]xic/i.test(txt);
                p._busca = [p.nombre, p.cientifico, p.ubicacion, p.luz, p.dificultad]
                           .join(' ').toLowerCase();
                TODAS.push(p);
            });
        });

        const esc = s => String(s).replace(/[&<>"]/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

        /* Enlace a Google Imágenes: científico + común
           (el común ayuda cuando el cultivar no es muy conocido) */
        function urlImagenes(planta){
            const q = planta.cientifico + ' ' + planta.nombre + ' planta';
            return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);
        }

        function campo(icon, titulo, texto, clases){
            if(!texto) return '';
            return `<div class="campo ${clases || ''}">
                ${icono(icon)}
                <div><h3>${titulo}</h3><p>${esc(texto)}</p></div>
            </div>`;
        }

        function fichaHTML(p){
            const lamina = ilustracion(p.nombre)
                || `<span class="sin-lamina">${icono('reproduccion')}</span>`;
            const acceso = String(p._n).padStart(2, '0');

            return `<article class="ficha" data-n="${p._n}">
                <div class="ficha-top">
                    <a class="marco" href="${urlImagenes(p)}" target="_blank" rel="noopener"
                       title="Ver fotografías de ${esc(p.nombre)} en Google Imágenes">
                        <span class="lienzo photo-wrap" data-especie="${esc(p.cientifico)}">${lamina}</span>
                        <span class="lupa">${icono('lupa')}</span>
                    </a>
                    <button class="resumen" type="button" aria-expanded="false">
                        <span class="linea-sup">
                            <span>
                                <span class="nombre">${esc(p.nombre)}</span>
                                <span class="binomio">${esc(p.cientifico)}</span>
                            </span>
                            <span class="acceso">N.º ${acceso}</span>
                        </span>
                        <span class="sitio">${esc(p.ubicacion)}${
                            p._toxica ? '<span class="sello">Tóxica</span>' : ''}</span>
                        <span class="etiqueta">
                            <span><span class="dt">Riego</span><span class="dd">${esc(p.riego)}</span></span>
                            <span><span class="dt">Luz</span><span class="dd">${esc(p.luz)}</span></span>
                            <span><span class="dt">Manejo</span><span class="dd">${esc(p.dificultad)}</span></span>
                        </span>
                        ${icono('chevron', 'chevron')}
                    </button>
                </div>
                <div class="detalle"><div class="interior">
                    <div class="campos">
                        ${campo('sustrato','Sustrato',p.sustrato,'ancho')}

        const nav   = document.getElementById('nav');

        ZONAS.forEach(clave => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = plantas[clave].corto;
            b.setAttribute('role', 'tab');
            b.dataset.zona = clave;
            b.onclick = () => { busca.value = ''; zonaActiva = clave; pintar(); };

        function pintar(){
            const q = busca.value.trim().toLowerCase();

            nav.querySelectorAll('button').forEach(b =>
                b.setAttribute('aria-selected', !q && b.dataset.zona === zonaActiva));

            if(q){
                const hits = TODAS.filter(p => p._busca.includes(q));
                hoja.innerHTML = hits.length
                    ? seccionHTML('Resultados', `Coincidencias con “${q}”`, hits)
                    : `<p class="vacio">Ninguna de las ${TODAS.length} plantas coincide con “${esc(q)}”.</p>`;
            }else{
                const z = plantas[zonaActiva];
                hoja.innerHTML = seccionHTML(z.corto, z.descripcion, z.plantas);
            }

            hoja.querySelectorAll('.resumen').forEach(btn => {
                btn.onclick = () => {
                    const ficha = btn.closest('.ficha');
                    const abierta = ficha.classList.toggle('abierta');
                    btn.setAttribute('aria-expanded', abierta);
                };
            });

        /* ===== FOTOS REALES (capa opcional sobre el dibujo) =====
           Motor v2: usa la Action API de MediaWiki (/w/api.php), que SÍ respeta
           origin=* y devuelve cabeceras CORS. (El endpoint REST
           /api/rest_v1/page/summary ignora origin=* y falla desde el navegador.)
           Estrategia por planta:
             1) prop=pageimages sobre todas las variantes del nombre en una sola
                petición por wiki (en, luego es), con redirects y normalización.
             2) Si no hay nada, búsqueda (generator=search) en la misma wiki.
           Si todo falla, se queda la ilustración SVG. */

        const cacheFotos = {};   // cientifico -> Promise<string|null>

        function variantesNombre(cientifico){
            const v = [];
            const push = s => { s = (s||'').trim(); if(s && !v.includes(s)) v.push(s); };
            push(cientifico.replace(/['\u2018\u2019"]/g,''));
            const sinCultivar = cientifico.replace(/\s*['\u2018\u2019"][^'\u2018\u2019"]*['\u2018\u2019"]\s*/g,' ');
            push(sinCultivar);
            const partes = sinCultivar.trim().split(/\s+/).filter(Boolean);
            if(partes.length >= 2) push(partes[0] + ' ' + partes[1]);
            if(partes.length >= 1) push(partes[0]);
            return v;
        }

        function apiURL(wiki, params){
            const p = new URLSearchParams(Object.assign({
                action: 'query',
                format: 'json',
                formatversion: '2',
                origin: '*'
            }, params));
            return 'https://' + wiki + '.wikipedia.org/w/api.php?' + p.toString();
        }

        async function pedirJSON(url){
            const r = await fetch(url, { redirect: 'follow' });
            if(!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }

        function sacarImagen(pagina){
            if(!pagina) return null;
            const t = (pagina.thumbnail && pagina.thumbnail.source)
                   || (pagina.original  && pagina.original.source);
            return t || null;
        }

        /* Devuelve la mejor foto de una wiki respetando el orden de prioridad
           de las variantes (más específica primero). */
        async function fotoPorTitulos(wiki, variantes){
            const orden = {};
            variantes.forEach((t,i) => { orden[t.toLowerCase()] = i; });

            const d = await pedirJSON(apiURL(wiki, {
                prop: 'pageimages',
                piprop: 'thumbnail|original',
                pithumbsize: '500',
                pilimit: '50',
                redirects: '1',
                titles: variantes.join('|')
            }));
            const q = d && d.query;
            if(!q || !q.pages) return null;

            /* Rastrear normalizaciones y redirecciones para saber a qué
               variante corresponde cada página devuelta. */
            const mapa = {};
            (q.normalized || []).forEach(n => { mapa[n.to.toLowerCase()] = (n.from||'').toLowerCase(); });
            (q.redirects  || []).forEach(n => { mapa[n.to.toLowerCase()] = (n.from||'').toLowerCase(); });
            const prioridad = titulo => {
                let t = (titulo||'').toLowerCase(), saltos = 0;
                while(saltos++ < 5){
                    if(t in orden) return orden[t];
                    if(!(t in mapa)) break;
                    t = mapa[t];
                }
                return 99;
            };

            let mejor = null, mejorP = 99;
            q.pages.forEach(p => {
                if(p.missing) return;
                const img = sacarImagen(p);
                if(!img) return;
                const pr = prioridad(p.title);
                if(pr < mejorP){ mejorP = pr; mejor = img; }
            });
            return mejor;
        }

        async function fotoPorBusqueda(wiki, consulta){
            const d = await pedirJSON(apiURL(wiki, {
                generator: 'search',
                gsrsearch: consulta,
                gsrlimit: '3',
                gsrnamespace: '0',
                prop: 'pageimages',
                piprop: 'thumbnail|original',
                pithumbsize: '500',
                pilimit: '50'
            }));
            const paginas = d && d.query && d.query.pages;
            if(!paginas) return null;
            paginas.sort((a,b) => (a.index||99) - (b.index||99));
            for(const p of paginas){
                const img = sacarImagen(p);
                if(img) return img;
            }
            return null;
        }

        function buscarFoto(cientifico){
            if(cientifico in cacheFotos) return cacheFotos[cientifico];
            const variantes = variantesNombre(cientifico);
            cacheFotos[cientifico] = (async () => {
                for(const wiki of ['en','es']){
                    try{
                        const img = await fotoPorTitulos(wiki, variantes);
                        if(img) return img;
                    }catch(err){ /* siguiente wiki */ }
                }
                for(const wiki of ['en','es']){
                    try{
                        const img = await fotoPorBusqueda(wiki, variantes[variantes.length-1] || cientifico);
                        if(img) return img;
                    }catch(err){ /* siguiente wiki */ }
                }
                return null;
            })();
            return cacheFotos[cientifico];
        }

        function cargarFotos(){
            document.querySelectorAll('.photo-wrap[data-especie]').forEach(async wrap => {
                if(wrap.dataset.listo) return;
                wrap.dataset.listo = '1';
                let src = null;
                try{ src = await buscarFoto(wrap.dataset.especie); }catch(err){ return; }
                if(!src) return;
                const img = document.createElement('img');
                img.className = 'plant-photo';
                img.alt = wrap.dataset.especie;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.referrerPolicy = 'no-referrer';
                img.onload = () => img.classList.add('loaded');
                img.onerror = () => img.remove();
                img.src = src;
                wrap.appendChild(img);
            });
        }

        /* Diagnóstico manual: abrir la consola del navegador (F12) y escribir
           diagFotos()  -> tabla con la foto encontrada para cada especie.
           Sirve para confirmar que la Action API responde y qué especie falla. */
        async function diagFotos(){
            const especies = [...new Set(
                [...document.querySelectorAll('.photo-wrap[data-especie]')]
                    .map(w => w.dataset.especie))];
            const filas = [];
            for(const e of especies){
                let url = null, error = '';
                try{ url = await buscarFoto(e); }catch(err){ error = err.message; }
                filas.push({ especie: e, foto: url ? 'OK' : 'sin foto', url: url || error });
            }
            console.table(filas);
            return filas;
        }
        window.diagFotos = diagFotos;
